name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the deploy job widens this for itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix server

      - name: Unit tests
        run: npm test --prefix server

      - name: Build frontend
        run: npm run build

  # Builds the API as a container and proves it works: the test suite runs
  # inside the image, then the real image is started and must serve requests.
  docker:
    name: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run the tests inside the container
        run: docker build -f server/Dockerfile --target test .

      - name: Build the API image
        run: docker build -f server/Dockerfile -t skyblockzordle-api .

      - name: Smoke test the running container
        run: |
          docker run -d --name api -p 3001:3001 skyblockzordle-api
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/api/health && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:3001/api/health | jq -e '.ok == true'
          # The daily puzzle must load without ever exposing the answer.
          curl -fsS http://localhost:3001/api/daily | jq -e '.puzzleNumber and (has("answer") | not)'
          test "$(docker exec api whoami)" = "node" || { echo "container runs as root"; exit 1; }

      - name: Container logs
        if: failure()
        run: docker logs api || true

  # The production DynamoDB store code against a real DynamoDB engine
  # (DynamoDB Local, from compose.yaml), including the concurrent-write tests.
  # The keys are dummies: the tests refuse any endpoint but the local one.
  integration:
    name: integration
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci --prefix server

      - name: Start DynamoDB Local
        run: docker compose up -d

      - name: Integration tests
        run: npm run test:integration --prefix server

      - name: DynamoDB Local logs
        if: failure()
        run: docker compose logs

  deploy:
    name: deploy
    needs: [test, docker, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Records a deployment against the repo, linked to the live site.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Keyless: GitHub hands AWS a short-lived OIDC token and assumes a role.
      # No long-lived AWS access keys are stored in this repository.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # Must come before `sam build`: the Lambda is bundled with esbuild, which
      # SAM expects to find in the project's node_modules.
      - name: Install
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Deploy API (Lambda + DynamoDB + CloudFront)
        working-directory: infra
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
        run: |
          # SAM rejects an empty "Key=" override, so the optional custom-domain
          # settings are only passed when they're set.
          overrides=("AllowedOrigin=$SITE_URL")
          if [ -n "$SITE_DOMAIN" ]; then overrides+=("SiteDomain=$SITE_DOMAIN"); fi
          if [ -n "$CERTIFICATE_ARN" ]; then overrides+=("CertificateArn=$CERTIFICATE_ARN"); fi
          sam build
          sam deploy \
            --stack-name "${{ vars.STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${overrides[@]}"

      - name: Build frontend against the deployed API
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      # Hashed asset filenames can be cached forever; index.html must not be,
      # or CloudFront will keep serving a page that points at deleted bundles.
      # audio/ is uploaded by hand and is not in the repo (licensed music), so
      # it's excluded here or --delete would remove it on every deploy.
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}" --delete \
            --exclude index.html \
            --exclude "audio/*" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --cache-control "no-cache,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths "/*"
