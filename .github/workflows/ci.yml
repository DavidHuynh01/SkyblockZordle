name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the deploy job widens this for itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix server

      - name: Unit tests
        run: npm test --prefix server

      - name: Build frontend
        run: npm run build

  deploy:
    name: deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Keyless: GitHub hands AWS a short-lived OIDC token and assumes a role.
      # No long-lived AWS access keys are stored in this repository.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Deploy API (Lambda + DynamoDB + CloudFront)
        working-directory: infra
        run: |
          sam build
          sam deploy \
            --stack-name "${{ vars.STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "AllowedOrigin=${{ vars.SITE_URL }}"

      - name: Build frontend against the deployed API
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          npm ci
          npm run build

      # Hashed asset filenames can be cached forever; index.html must not be,
      # or CloudFront will keep serving a page that points at deleted bundles.
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}" --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --cache-control "no-cache,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths "/*"
