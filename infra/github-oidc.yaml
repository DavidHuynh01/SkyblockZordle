AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Keyless CI deploys. Lets GitHub Actions assume a deploy role via OpenID
  Connect, so no long-lived AWS access keys ever live in the repository or in
  GitHub secrets. Deployed once, by hand, before the pipeline can run.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub user or organisation that owns the repository
  GitHubRepo:
    Type: String
    Description: Repository name
  Branch:
    Type: String
    Default: main
    Description: Only workflow runs on this branch may assume the role
  Environment:
    Type: String
    Default: production
    Description: GitHub deployment environment the deploy job runs in
  StackName:
    Type: String
    Default: skyblockzordle
    Description: The application stack this role is allowed to deploy
  SsmPrefix:
    Type: String
    Default: /skyblockzordle
    Description: SSM prefix the API Lambda reads its secrets from (matches the app template)

Resources:
  # AWS trusts tokens issued by GitHub's OIDC endpoint.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Ceiling for every role the deploy role creates or edits. A role's effective
  # permissions are the intersection of its policies and this boundary, so even
  # if CI attaches AdministratorAccess to a role it creates, that role can still
  # only do what the API Lambda needs. The deploy role cannot edit this policy.
  LambdaBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${StackName}-lambda-boundary"
      Description: Permissions boundary for roles created by the CI deploy role
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:ConditionCheckItem
              - dynamodb:DescribeTable
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackName}*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackName}*/index/*"
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*"
          # SecureString parameters are decrypted through SSM only.
          - Effect: Allow
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}*"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}*:*"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      # Must NOT start with ${StackName}: the IAM statement below grants
      # role management on `role/${StackName}*`, and a name inside that
      # pattern would let this role grant itself any permission.
      RoleName: !Sub "github-deploy-${StackName}"
      Description: Assumed by GitHub Actions to deploy the application stack
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            # Pinned to one repo AND one branch: a fork or a pull request
            # cannot mint credentials.
            #
            # The real pins are `repository` and `ref`, matched exactly.
            # `sub` is matched loosely because GitHub now embeds immutable
            # numeric ids in it (repo:owner@123/name@456:ref:refs/heads/main),
            # so the old literal no longer matches — but IAM refuses a trust
            # policy that does not constrain `sub` at all, hence both forms.
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository: !Sub "${GitHubOrg}/${GitHubRepo}"
                token.actions.githubusercontent.com:ref: !Sub "refs/heads/${Branch}"
              # A job that declares a deployment environment gets
              # ":environment:<name>" in place of ":ref:<branch>", so both
              # shapes are listed. The `ref` pin above still restricts this to
              # the branch either way.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${Branch}"
                  - !Sub "repo:${GitHubOrg}@*/${GitHubRepo}@*:ref:refs/heads/${Branch}"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${Environment}"
                  - !Sub "repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:${Environment}"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation drives the deployment of this stack only.
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
              # Expanding the SAM macro into plain CloudFormation.
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              # SAM's managed bucket for build artefacts (--resolve-s3), plus
              # the site bucket the built frontend is published to.
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPolicy
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucketPolicy
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default*
                  - arn:aws:s3:::aws-sam-cli-managed-default*/*
                  - !Sub "arn:aws:s3:::${StackName}*"
                  - !Sub "arn:aws:s3:::${StackName}*/*"
              - Effect: Allow
                Action:
                  - lambda:*
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackName}*"
              - Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:ListTagsOfResource
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackName}*"
              # The Lambda execution role is created and attached by the stack.
              # Anything that can add permissions to a role is allowed only
              # when that role carries LambdaBoundary, so CI cannot mint a
              # role more powerful than the API Lambda needs.
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:PutRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${StackName}*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref LambdaBoundary
              # Read, tag and remove-only actions; none of these can widen a role.
              - Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${StackName}*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${StackName}*"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # CloudFront has no resource-level permissions for these calls.
              - Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:CreateInvalidation
                Resource: "*"
              # Read-only: lets CloudFront's update check the custom domain's
              # certificate. Cannot create, change or export certificates.
              - Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}*"

Outputs:
  DeployRoleArn:
    Description: Store as the AWS_DEPLOY_ROLE_ARN secret in GitHub
    Value: !GetAtt DeployRole.Arn
  LambdaBoundaryArn:
    Description: Permissions boundary every app-stack role must carry
    Value: !Ref LambdaBoundary
