AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SkyblockZordle API - Lambda Function URL + DynamoDB (serverless, pay-per-request)

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Origin allowed to call the API (set to your site URL once deployed)
  SsmPrefix:
    Type: String
    Default: /skyblockzordle
    Description: SSM Parameter Store prefix holding the Discord + session secrets
  ApiBaseUrl:
    Type: String
    Default: ""
    Description: The API's own base URL, used to build the Discord OAuth redirect URI

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 5    # bound worst-case duration billing
    MemorySize: 256
    Architectures: [arm64]   # cheaper per ms than x86

Resources:
  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Provisioned (not on-demand) so spend has a hard ceiling: excess traffic
      # is throttled rather than billed. 5/5 sits inside the always-free tier.
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Minify: true
        OutExtension: [".js=.mjs"]
        EntryPoints: [lambda/handler.js]
        External: ["@aws-sdk/*"]   # provided by the Lambda runtime
    Properties:
      CodeUri: ../
      Handler: handler.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ScoresTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SITE_URL: !Ref AllowedOrigin
          SSM_PREFIX: !Ref SsmPrefix
          REDIRECT_URI: !Sub "${ApiBaseUrl}/api/auth/callback"
      # No ReservedConcurrentExecutions: new accounts have a total concurrency
      # quota of 10, and reserving any of it drops the unreserved pool below the
      # required minimum. The account-level cap already bounds runaway cost.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
        - Statement:                        # read the Discord + session secrets
            - Effect: Allow
              Action: [ssm:GetParameters, ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"
      FunctionUrlConfig:
        AuthType: NONE          # public game API, no credentials needed
        Cors:
          AllowOrigins: [!Ref AllowedOrigin]
          AllowMethods: [GET, POST]   # preflight OPTIONS is handled by the Function URL itself
          AllowHeaders: [content-type, authorization]   # authorization is required for the Discord session token

  # ---- Frontend hosting: private S3 bucket behind CloudFront ----
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:   # bucket stays private; only CloudFront reads it
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100          # cheapest edge locations
        Origins:
          - Id: SiteS3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: SiteS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed: CachingOptimized
        CustomErrorResponses:               # single-page app: serve index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  ApiUrl:
    Description: Set this as VITE_API_URL (append /api) when building the frontend
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref ScoresTable
  SiteUrl:
    Description: Public site URL (CloudFront)
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Description: Upload the built frontend here (aws s3 sync dist/ s3://<this>)
    Value: !Ref SiteBucket
